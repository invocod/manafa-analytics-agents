<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manafa BI Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout idea: fixed operations shell (sidebar + status bar), each view is a dense grid of panels; the Agent Command Center centres an orchestration map above live cards. Dark-first, single theme. */
:root{
  --bg:#0a0f1e;          /* deep navy */
  --surface:#111830;     /* dark slate panels */
  --surface-2:#172040;   /* raised */
  --line:#232d4f;        /* low-contrast borders */
  --text:#e6e9f5;
  --muted:#8b93b0;
  --brand:#293AE0;       /* Manafa blue */
  --brand-2:#3A9AF4;     /* bright blue / cyan accent */
  --purple:#5746C6;
  --ok:#22c38e; --warn:#f2b136; --err:#ef5a5a; --idle:#5b6485;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-2)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mono{font-family:var(--font-mono);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Shell */
.app{display:grid;grid-template-columns:auto 1fr;height:100%}
.side{width:236px;background:#0c1226;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .22s ease;overflow:hidden}
.side.collapsed{width:64px}
.brand{display:flex;align-items:center;gap:10px;padding:16px;height:60px;border-bottom:1px solid var(--line);white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--purple));display:grid;place-items:center;font-weight:700;flex:none}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap;position:relative}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.on{background:var(--surface-2);color:var(--text)}
.nav a.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand-2)}
.nav .badge{margin-left:auto}
.nav a svg{flex:none}
.nav a span:not(.badge){min-width:0;overflow:hidden;text-overflow:ellipsis}
.side-foot{padding:10px 8px;border-top:1px solid var(--line)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(10,15,30,.85);backdrop-filter:blur(8px);flex:none}
.top .grow{flex:1}
.menu-btn{display:none}
.content{flex:1;overflow:auto;padding:20px 24px 40px}
.view{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Primitives */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#34406b;background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#3445ee}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.panel{background:linear-gradient(180deg,var(--surface),#0f1630);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h .grow{flex:1}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h .grow{flex:1}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:75ch}
.src{font-size:11px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.src b{font-weight:500;color:#aab2cf}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--text)}
.seg button+button{border-left:1px solid var(--line)}
.note{border:1px dashed #34406b;border-radius:8px;padding:10px 12px;color:var(--muted);font-size:12.5px}
.note.warn{border-color:rgba(242,177,54,.45);color:#e9cf96}
.note.err{border-color:rgba(239,90,90,.5);color:#f2b1b1}
.empty{padding:28px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;white-space:nowrap}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:rgba(58,154,244,.05)}
.tablewrap{overflow-x:auto}
.skel{background:linear-gradient(90deg,#141c38 0%,#1b2549 50%,#141c38 100%);background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
input[type=date],select,input[type=text],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;transition:transform .18s ease,border-color .18s ease}
.kpi:hover{transform:translateY(-2px);border-color:#34406b}
.kpi .row{display:flex;align-items:center;gap:8px}
.kpi .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(41,58,224,.18);color:#9fb0ff;flex:none}
.kpi .val{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi .unit{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.delta{font-size:12px;display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:6px}
.delta.up{color:var(--ok);background:rgba(34,195,142,.1)}
.delta.down{color:var(--err);background:rgba(239,90,90,.1)}
.delta.flat{color:var(--muted);background:var(--surface-2)}
.spark{height:34px;width:100%}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}

/* Status visuals */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st .dot{position:relative}
.st-idle .dot{background:var(--idle)}
.st-queued .dot{background:#9aa3c7}
.st-initializing .dot,.st-running .dot,.st-processing .dot,.st-analyzing .dot{background:var(--brand-2)}
.st-waiting .dot{background:var(--purple)}
.st-completed .dot{background:var(--ok)}
.st-failed .dot{background:var(--err)}
.st-cancelled .dot{background:#6b7280}
.st-running,.st-processing,.st-analyzing,.st-initializing{border-color:rgba(58,154,244,.45);color:#cfe6ff}
.st-completed{border-color:rgba(34,195,142,.4);color:#bdf3df}
.st-failed{border-color:rgba(239,90,90,.5);color:#ffc9c9}
.st-waiting{border-color:rgba(87,70,198,.6);color:#d5cffb}
.pulse .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:.5;animation:pl 1.6s ease-out infinite;color:var(--brand-2)}
@keyframes pl{from{transform:scale(.6);opacity:.7}to{transform:scale(1.8);opacity:0}}

/* Agent cards */
.agent{cursor:pointer;position:relative;transition:transform .18s ease,border-color .2s ease,box-shadow .2s ease;display:flex;flex-direction:column;gap:10px}
.agent:hover{transform:translateY(-2px);border-color:#34406b}
.agent.active{border-color:rgba(58,154,244,.55);box-shadow:0 0 0 1px rgba(58,154,244,.25),0 8px 28px -12px rgba(58,154,244,.45)}
.agent.active::after{content:"";position:absolute;inset:-1px;border-radius:var(--r);padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--brand-2) 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.agent.done-flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(34,195,142,.6)}100%{box-shadow:0 0 0 14px rgba(34,195,142,0)}}
.agent .head{display:flex;gap:10px;align-items:flex-start}
.agent .av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.agent .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.agent .meta div{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.agent .meta b{display:block;font-size:13px;font-weight:600}
.agent .meta span{font-size:11px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:#1b2447;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.ok i{background:var(--ok)}
.bar.err i{background:var(--err)}
.bar.indet i{width:35%!important;position:absolute;animation:indet 1.3s ease-in-out infinite}
@keyframes indet{from{left:-35%}to{left:100%}}

/* Orchestration map */
.orch{height:300px;position:relative}
.orch svg{width:100%;height:100%}
.edge{stroke:#2a3560;stroke-width:1.5;fill:none}
.edge.active{stroke:var(--brand-2);stroke-dasharray:6 6;animation:dash .8s linear infinite}
.edge.ok{stroke:rgba(34,195,142,.6)}
.edge.err{stroke:rgba(239,90,90,.7)}
@keyframes dash{to{stroke-dashoffset:-12}}
.node rect{fill:var(--surface-2);stroke:#2f3a66;transition:stroke .3s ease,fill .3s ease}
.node text{fill:var(--text);font:500 11.5px var(--font-body)}
.node .sub{fill:var(--muted);font-size:10px}
.node.active rect{stroke:var(--brand-2);fill:#16224a}
.node.ok rect{stroke:rgba(34,195,142,.7)}
.node.err rect{stroke:var(--err)}
.node{cursor:pointer}
.node.active .ring{animation:pl 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}

/* Timeline + feed */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 14px}
.tl-item .pin{position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--idle)}
.tl-item.ok .pin{border-color:var(--ok);background:rgba(34,195,142,.25)}
.tl-item.run .pin{border-color:var(--brand-2);background:rgba(58,154,244,.25)}
.tl-item.err .pin{border-color:var(--err);background:rgba(239,90,90,.25)}
.tl-item.warn .pin{border-color:var(--warn)}
.feed{height:340px;overflow:auto;font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:#0b1124;padding:8px}
.feed .ln{display:grid;grid-template-columns:auto auto 1fr;gap:10px;padding:4px 6px;border-radius:6px;animation:viewIn .25s ease both}
.feed .ln:hover{background:rgba(255,255,255,.03)}
.feed .t{color:var(--muted)}
.feed .ag{color:#9fb0ff}
.feed .k-error{color:#ffb0b0}
.feed .k-warning{color:#f3d699}
.feed .k-step_done,.feed .k-run_done{color:#a8efd4}


/* Jira tab (Linear-style list + side panel) */
.jr{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0d1330}
.jr-main{min-width:0;border-right:1px solid var(--line)}
.jr-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.jr-bar .grow{flex:1}
.jr-group{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#121a3a;border-bottom:1px solid var(--line);font-weight:500}
.jr-group .cnt{color:var(--muted);font-weight:400}
.jr-row{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;border-bottom:1px solid rgba(35,45,79,.6);cursor:pointer}
.jr-row:hover{background:rgba(58,154,244,.05)}
.jr-row .key{font-family:var(--font-mono);font-size:12px;color:var(--muted);width:78px;flex:none}
.jr-row .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-row .meta{display:flex;align-items:center;gap:8px;flex:none}
.jr-row .date{color:var(--muted);font-size:12px;width:46px;text-align:right}
.jr-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:#c9cfe6;white-space:nowrap}
.jr-chip .d{width:6px;height:6px;border-radius:50%}
.jr-av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#0a0f1e;flex:none}
.jr-side{padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.jr-side .sec{border-top:1px solid var(--line);padding-top:16px}
.jr-prop{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:center;font-size:13px}
.jr-prop .k{color:var(--muted)}
.jr-ep{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:#a78bfa}
.jr-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.jr-legend .n{font-size:14px;color:var(--text)}
.jr-md h2{font-size:14px;margin:16px 0 6px}
.jr-md p,.jr-md li{color:#c9cfe6;font-size:13px}
.jr-md ul,.jr-md ol{padding-left:18px;margin:6px 0}
.jr-md code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.jr-md table{margin:8px 0}
.jr-md td,.jr-md th{padding:6px 8px;font-size:12.5px}
@media (max-width:1100px){.jr{grid-template-columns:1fr}.jr-main{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:640px){.jr-row .meta .jr-chip.opt{display:none}.jr-row .key{width:64px}}
@keyframes rspin{to{transform:rotate(360deg)}}
/* Users tab */
.ux-sec{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.ux-sec h2{font-size:16px}
.ux-sec .line{flex:1;height:1px;background:var(--line)}
.bl{display:grid;gap:7px}
.bl-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bl-row .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9cfe6}
.bl-row .tr{height:8px;border-radius:4px;background:#1a2346;overflow:hidden}
.bl-row .br{height:100%;border-radius:4px}
.bl-row .vl{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:86px}
.ux-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.ux-mini .k{font-size:12px;color:var(--muted)}
.ux-mini .v{font-size:18px;font-weight:600}
/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(3,6,16,.55);z-index:30;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#0d1430;border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;animation:slide .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand-2)}
.modal{position:fixed;left:50%;top:10vh;transform:translateX(-50%);width:min(680px,calc(100% - 32px));background:#0f1734;border:1px solid var(--line);border-radius:12px;z-index:31;animation:pop .22s ease both;max-height:76vh;display:flex;flex-direction:column}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.97)}}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:16px 18px;overflow:auto}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#0f1734;border:1px solid var(--line);border-radius:10px;min-width:260px;z-index:40;padding:6px;animation:pop2 .16s ease both;box-shadow:0 12px 32px -10px rgba(0,0,0,.6)}
@keyframes pop2{from{opacity:0;transform:translateY(-4px)}}
.menu .mi{padding:8px 10px;border-radius:6px;display:block;color:var(--text);text-decoration:none;font-size:13px}
.menu .mi:hover{background:var(--surface)}
.run-prompt{border:1px solid rgba(58,154,244,.55);background:linear-gradient(180deg,#13204a,#0f1734);border-radius:10px;padding:14px 16px;box-shadow:0 0 0 1px rgba(58,154,244,.15),0 10px 30px -14px rgba(58,154,244,.5)}
.run-prompt-text{font:500 16px/1.55 var(--font-body);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre.code{background:#0b1124;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font:12px/1.5 var(--font-mono);white-space:pre-wrap}

/* Markdown */
.md{max-width:86ch;line-height:1.6}
.md h1{font-size:19px;margin:6px 0 10px}
.md h2{font-size:16px;margin:20px 0 8px}
.md h3{font-size:13px;margin:16px 0 6px}
.md table{margin:10px 0;font-size:12.5px}
.md code{font-family:var(--font-mono);font-size:12px;background:#0b1124;padding:1px 5px;border-radius:4px}
.md ul{padding-left:20px}
.label-data,.label-ai{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.label-data{background:rgba(58,154,244,.14);color:#bfe0ff;border:1px solid rgba(58,154,244,.35)}
.label-ai{background:rgba(87,70,198,.18);color:#d9d3ff;border:1px solid rgba(87,70,198,.5)}
.sev-high{border-left:3px solid var(--err)}
.sev-med{border-left:3px solid var(--warn)}
.sev-low{border-left:3px solid var(--idle)}
.issue{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.015);cursor:pointer}
.issue:hover{border-color:#34406b}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{position:fixed;z-index:35;height:100%;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;width:236px}
  .side.mobile-open{transform:none}
  .app{grid-template-columns:1fr}
  .g4,.g3,.g2{grid-template-columns:1fr}

/* ---------------- icons (lucide) ---------------- */
function Icon({name,size=16,stroke=1.75,style}){
  const node = (window.lucide && lucide.icons && (lucide.icons[name] || lucide.icons.Circle)) || null;
  if(!node) return html`<span style=${{display:"inline-block",width:size,height:size}}></span>`;
  const kids = (Array.isArray(node) && node[0]==="svg") ? node[2] : node;
  return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${stroke} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${style}>
    ${(kids||[]).map((c,i)=>React.createElement(c[0],{key:i,...c[1]}))}</svg>`;
}

/* ---------------- formatting ---------------- */
const nf = new Intl.NumberFormat("en-US");
const fmtN = v => v==null||isNaN(v) ? "—" : nf.format(Math.round(v));
const fmtSAR = v => {
  if(v==null||isNaN(v)) return "—";
  const a=Math.abs(v); if(a>=1e6) return (v/1e6).toFixed(a>=1e7?1:2)+"M"; if(a>=1e3) return (v/1e3).toFixed(1)+"k"; return nf.format(Math.round(v));
};
const pct = (v,d=1) => v==null||isNaN(v) ? "—" : (v*100).toFixed(d)+"%";
function fmtTs(ts){ if(!ts) return "—"; const d=new Date(ts); if(isNaN(d)) return String(ts);
  return d.toLocaleString("en-GB",{timeZone:"Asia/Riyadh",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+" AST"; }
function fmtDur(ms){ if(ms==null||isNaN(ms)||ms<0) return "—"; const s=Math.round(ms/1000); if(s<60) return s+"s"; const m=Math.floor(s/60); if(m<60) return m+"m "+(s%60)+"s"; return Math.floor(m/60)+"h "+(m%60)+"m"; }
const dayStr = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return dayStr(d); };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- capability bootstrap ---------------- */
const caps = {db:undefined, mcp:undefined};
const capListeners = new Set();
function onCaps(f){capListeners.add(f); return ()=>capListeners.delete(f);}
(async()=>{
  const use = n => (window.claude && claude.use) ? claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db,mcp] = await Promise.all([use("db"),use("mcp")]);
  caps.db = db; caps.mcp = mcp; capListeners.forEach(f=>f());
})();
function useCaps(){ const [,t]=useState(0); useEffect(()=>onCaps(()=>t(x=>x+1)),[]); return caps; }

/* ---------------- db hooks (subscribe once) ---------------- */
function useDbQuery(key, build){
  const c = useCaps();
  const [st,setSt] = useState({loading:true, docs:[], err:null, slow:false});
  useEffect(()=>{
    if(c.db===undefined) return;
    if(c.db===null){ setSt({loading:false,docs:[],err:"unavailable",slow:false}); return; }
    let timer = setTimeout(()=>setSt(s=>({...s,slow:true})),10000);
    let unsub = ()=>{};
    try{
      unsub = build(c.db).onSnapshot(snap=>{
        if(!snap.metadata || !snap.metadata.fromCache){ clearTimeout(timer); }
        setSt({loading:false, slow:false, err:null, docs:snap.docs.map(d=>({id:d.id,...d.data()}))});
      }, e=>{ clearTimeout(timer); setSt(s=>({...s,loading:false,err:e&&e.code||"error"})); });
    }catch(e){ clearTimeout(timer); setSt({loading:false,docs:[],err:"invalid",slow:false}); }
    return ()=>{ clearTimeout(timer); unsub(); };
  },[c.db,key]);
  return st;
}
function useDbDoc(path){
  const c = useCaps();
  const [st,setSt] = useState({loading:true,data:null});
  useEffect(()=>{
    if(c.db===undefined) return;
    if(!c.db){ setSt({loading:false,data:null}); return; }
    let unsub=()=>{};
    try{ unsub = c.db.doc(path).onSnapshot(s=>setSt({loading:false,data:s.exists?s.data():null}),()=>setSt({loading:false,data:null})); }catch(e){ setSt({loading:false,data:null}); }
    return ()=>unsub();
  },[c.db,path]);
  return st;
}

/* ---------------- BigQuery (read-only, via viewer's connector) ---------------- */
const bqStore = new Map(); // key -> {state, subs:Set, unsub}
const bqGlobal = new Set(); const bqNotify = () => bqGlobal.forEach(f=>f());
function parseBQ(payload){
  let p = payload;
  if(typeof p === "string"){ try{ p = JSON.parse(p); }catch(e){ return []; } }
  if(!p) return [];
  if(Array.isArray(p)) return p;
  if(p.rows && p.schema && p.schema.fields){
    const f = p.schema.fields;
    return p.rows.map(r=>{ const o={}; (r.f||[]).forEach((c,i)=>{ const fld=f[i]; let v=c.v;
      if(v!=null && ["INTEGER","INT64","FLOAT","FLOAT64","NUMERIC","BIGNUMERIC"].includes(fld.type)) v=Number(v);
      o[fld.name]=v; }); return o; });
  }
  if(Array.isArray(p.rows)) return p.rows;
  return [];
}
function mcpWatch(key, call){
  let e = bqStore.get(key);
  if(e) return e;
  e = {state:{status:"loading",rows:null,error:null,storedAt:null}, subs:new Set(), unsub:null, call};
  bqStore.set(key,e);
  const set = s => { e.state={...e.state,...s}; e.subs.forEach(f=>f(e.state)); bqNotify(); };
  const start = () => {
    if(caps.mcp===undefined) return;
    if(!caps.mcp){ set({status:"nomcp"}); return; }
    try{
      e.unsub = caps.mcp.watchTool(call.server, call.tool, call.input, ev=>{
        if(ev.type==="data"){
          const res = ev.result||{};
          set({status:"ok", rows:call.parse(res.payload), error:null, storedAt:(res.cache&&res.cache.storedAt)||Date.now()});
        } else {
          const code = ev.error && ev.error.code;
          const retract = ["needs_reauth","server_not_connected","blocked_by_policy","not_in_manifest","not_granted","selection_required"].includes(code);
          if(retract) set({status:"denied", error:ev.error, rows:null});
          else if(code==="approval_required") set({status: e.state.rows ? "approval" : "denied", error:ev.error});
          else set({status: e.state.rows ? "stale" : "error", error:ev.error||{code:"upstream_error"}});
        }
      }, {refetchInterval:call.refetch||300000, cache:{staleTime:(call.refetch||300000)-60000, gcTime:86400000}});
    }catch(err){ set({status:"error",error:{code:"bad_request",message:String(err)}}); }
  };
  e.set = set;
  const guard = () => setTimeout(()=>{ if(e.state.status==="loading" && !e.state.rows && caps.mcp) runCall(e).catch(err=>applyCallError(e,err)); }, 25000);
  if(caps.mcp===undefined) onCaps(()=>{ start(); guard(); }); else { start(); guard(); }
  return e;
}
function applyCallError(e,err){
  const code=err&&err.code;
  const retract=["needs_reauth","server_not_connected","blocked_by_policy","not_in_manifest","not_granted","selection_required"].includes(code);
  if(retract) e.set({status:"denied",error:err,rows:null});
  else if(code==="approval_required") e.set({status:e.state.rows?"approval":"denied",error:err});
  else e.set({status:e.state.rows?"stale":"error",error:err&&err.code?err:{code:"upstream_error",message:String(err&&err.message||err)}});
}
/* Reload every live query this page has opened (BigQuery, Google Sheets, Jira). Rows already on screen stay until the new data arrives. */
async function reloadAll(){
  const all=[...bqStore.values()];
  if(!caps.mcp) return {ok:0,fail:all.length,total:all.length};
  all.forEach(e=>{ if(!e.state.rows) e.set({status:"loading",error:null}); });
  const res=await Promise.allSettled(all.map(e=>runCall(e)));
  let ok=0, fail=0;
  res.forEach((r,i)=>{ if(r.status==="fulfilled") ok++; else { fail++; applyCallError(all[i],r.reason); } });
  bqNotify();
  return {ok,fail,total:all.length};
}
function parseSheet(payload){
  let p=payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(e){return [];} }
  if(p&&p.content) p=p.content;
  return (p&&Array.isArray(p.values))?p.values:[];
}
function bqWatch(key, sql, refetch){ return mcpWatch(key,{server:BQ_SERVER,tool:BQ_TOOL,input:{projectId:PROJECT,query:sql},parse:parseBQ,label:"BigQuery",refetch}); }
function useBQSlow(key, sql){ const e=useMemo(()=>bqWatch(key,sql,1800000),[key]); return useWatchEntry(e); }
async function runCall(e){ const c=e.call; const r=await caps.mcp.callTool(c.server,c.tool,c.input); e.state={status:"ok",rows:c.parse(r.payload),error:null,storedAt:Date.now()}; e.subs.forEach(f=>f(e.state)); bqNotify(); }
function useWatchEntry(e){
  const [s,setS] = useState(e.state);
  useEffect(()=>{ e.subs.add(setS); setS(e.state); return ()=>e.subs.delete(setS); },[e]);
  const allow = useCallback(async()=>{ try{ await runCall(e); }catch(err){ e.state={...e.state,error:err}; e.subs.forEach(f=>f(e.state)); } bqNotify(); },[e]);
  return {...s, allow};
}
function useSheet(key, range){ const e=useMemo(()=>mcpWatch(key,{server:SHEETS_SERVER,tool:"get_values",input:{spreadsheetId:SINGULAR_SHEET,range},parse:parseSheet,label:"Google Sheets"}),[key]); return useWatchEntry(e); }
function parseJira(payload){
  let p=payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(e){return [];} }
  if(p&&p.content&&!p.data&&!p.issues) p=p.content;
  const iss=(p&&p.data&&p.data.issues)||(p&&p.issues)||[];
  return iss.map(x=>{ const f=x.fields||{}; let dev=f.customfield_10055;
    if(!dev&&f.customFields&&f.customFields["Dev Assignee"]) dev=f.customFields["Dev Assignee"].value;
    const devName=dev?(Array.isArray(dev)?dev.map(d=>d&&d.displayName).filter(Boolean).join(", "):dev.displayName):null;
    const st=f.status||{}; const sc=st.statusCategory||{}; const ck=String(sc.key||sc.name||"").toLowerCase();
    const cat=ck.includes("done")?"done":(ck.includes("indeterminate")||ck.includes("progress"))?"progress":"todo";
    return {key:x.key,summary:(f.summary||"").trim(),status:st.name||"—",cat,priority:f.priority&&f.priority.name,labels:f.labels||[],created:f.created,resolved:f.resolutiondate,catChanged:f.statuscategorychangedate,due:f.duedate,dev:devName,type:f.issuetype&&f.issuetype.name,reporter:f.reporter&&f.reporter.displayName}; });
}
function useJira(key,jql){ const e=useMemo(()=>mcpWatch(key,{server:JIRA_SERVER,tool:"searchJiraIssuesUsingJql",input:{cloudId:JIRA_SITE,jql,fields:JIRA_FIELDS,maxResults:100,view:"full"},parse:parseJira,label:"Jira"}),[key]); return useWatchEntry(e); }
function useBQ(key, sql){
  const e = useMemo(()=>bqWatch(key,sql),[key]);
  return useWatchEntry(e);
}

const USERS_SQL = {

/* ---------------- small components ---------------- */
function Status({s}){ const [l,c]=STATUS[s]||STATUS.idle; return html`<span className=${"st "+c}><span className="dot"></span>${l}</span>`; }
function Source({children}){ return html`<span className="src"><${Icon} name="Database" size=${12}/> ${children}</span>`; }
function Skel({h=18,w="100%"}){ return html`<div className="skel" style=${{height:h,width:w}}></div>`; }
function Count({value,fmt=fmtN}){
  const [v,setV]=useState(REDUCED||value==null?value:0); const from=useRef(0);
  useEffect(()=>{ if(value==null||REDUCED){setV(value);return;} const a=from.current||0,b=value,t0=performance.now(),D=700; let raf;
    const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3); setV(a+(b-a)*e); if(k<1) raf=requestAnimationFrame(step); else from.current=b;};
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[value]);
  return html`<span>${fmt(v)}</span>`;
}
function Delta({cur,prev,invert}){
  if(cur==null||prev==null||prev===0) return html`<span className="delta flat">no prior</span>`;
  const d=(cur-prev)/prev; const dir=Math.abs(d)<0.005?"flat":(d>0?"up":"down");
  const cls = invert&&dir!=="flat" ? (dir==="up"?"down":"up") : dir;
  return html`<span className=${"delta "+cls}><${Icon} name=${dir==="up"?"TrendingUp":dir==="down"?"TrendingDown":"Minus"} size=${12}/>${(d>0?"+":"")+(d*100).toFixed(1)}%</span>`;
}
function Spark({data,color="#3A9AF4"}){
  if(!data||data.length<2) return html`<svg className="spark"></svg>`;
  const W=200,H=34,max=Math.max(...data,1),min=Math.min(...data,0);
  const pts=data.map((v,i)=>[i*(W/(data.length-1)), H-3-((v-min)/(max-min||1))*(H-8)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return html`<svg className="spark" viewBox=${"0 0 "+W+" "+H} preserveAspectRatio="none" aria-hidden="true">
    <path d=${d+" L"+W+" "+H+" L0 "+H+" Z"} fill=${color} opacity="0.12"/>
    <path d=${d} fill="none" stroke=${color} strokeWidth="1.6" vectorEffect="non-scaling-stroke" style=${REDUCED?null:{strokeDasharray:600,strokeDashoffset:600,animation:"draw 1s ease forwards"}}/>
    <circle cx=${last[0]} cy=${last[1]} r="2.6" fill=${color}/></svg>`;
}
function BQState({q,label="BigQuery"}){
  const conn = label==="Google Sheets"||label==="Singular sheet" ? "Google Sheets" : label==="Jira" ? "Atlassian MCP" : "Google Cloud BigQuery";
  if(q.status==="loading") return html`<div className="grid" style=${{gap:8}}><${Skel} h=${14} w="40%"/><${Skel} h=${120}/></div>`;
  if(q.status==="nomcp") return html`<div className="note">Live data needs this page open in claude.ai, signed in, with the ${conn} connector.</div>`;
  if(q.status==="denied"){
    const c=q.error&&q.error.code;
    const msg = c==="needs_reauth" ? "Your "+conn+" connection expired. Reconnect it in claude.ai Settings → Connectors."
      : c==="server_not_connected" ? "Add the "+conn+" connector in claude.ai Settings → Connectors to see live data."
      : c==="selection_required" ? "Choose which "+conn+" connector this page should use in the claude.ai prompt."
      : c==="approval_required" ? "This page needs your approval to read "+(conn==="Google Sheets"?"the Singular sheet (read-only)":conn==="Atlassian MCP"?"Jira (read-only search)":"BigQuery (read-only queries)")+"."
      : c==="not_in_manifest" ? conn+" access is turned off for this page in your view."
      : c==="blocked_by_policy" ? "Your organization's policy blocks this "+conn+" tool for you."
      : "Live "+conn+" data isn't available in this view.";
    return html`<div className="note warn">${msg} ${c==="approval_required"?html`<button className="btn sm" style=${{marginLeft:8}} onClick=${q.allow}>Allow read-only access</button>`:null}</div>`;
  }
  if(q.status==="error") return html`<div className="note err">${label} didn't answer (${esc(q.error&&q.error.code)}). It will retry on the next refresh. ${q.error&&q.error.code==="tool_error"?html`<div className="mono" style=${{marginTop:6}}>${String(q.error.message||"").slice(0,240)}</div>`:null}</div>`;
  return null;
}

/* ---------------- markdown (escaped, minimal) ---------------- */
function mdToHtml(src){
  const lines=String(src||"").split("\n"); let out=[],i=0,list=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  const closeList=()=>{ if(list){out.push("</ul>");list=false;} };
  while(i<lines.length){ const l=lines[i];
    if(/^\|/.test(l)){ closeList(); const rows=[]; while(i<lines.length&&/^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\|[\s:|-]+\|?$/.test(r));
      out.push('<div className="tablewrap"><table><thead><tr>'+cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+body.slice(1).map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"); continue; }
    if(/^```/.test(l)){ closeList(); i++; const b=[]; while(i<lines.length&&!/^```/.test(lines[i])){b.push(lines[i]);i++;} i++; out.push('<pre className="code">'+esc(b.join("\n"))+"</pre>"); continue; }
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){ closeList(); out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"); }
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){ if(!list){out.push("<ul>");list=true;} out.push("<li>"+inline(m[1])+"</li>"); }
    else if(l.trim()===""){ closeList(); }
    else { closeList(); out.push("<p>"+inline(l)+"</p>"); }
    i++; }
  closeList(); return out.join("");
}

function runDuration(r){ const a=Date.parse(r.started_at), b=r.ended_at?Date.parse(r.ended_at):(ACTIVE.has(r.status)?Date.now():null); return a&&b?b-a:null; }
function agentStateFrom(runs, agentId){
  const sorted=[...runs].sort((a,b)=>String(b.started_at).localeCompare(String(a.started_at)));
  for(const r of sorted){ const a=r.agents&&r.agents[agentId]; if(a) return {run:r, a}; }
  return null;
}
function allEvents(runs){
  const ev=[]; runs.forEach(r=>(r.events||[]).forEach((e,i)=>ev.push({...e, run_id:r.id, _k:r.id+":"+i})));
  return ev.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
}

function askCheckSql(raw){
  let s = String(raw||"").trim().replace(/;\s*$/,"");
  if(!s) throw new Error("Empty query.");

  if(t.includes(";")) throw new Error("One statement only.");
  if(!/^\s*\(?\s*(WITH|SELECT)\b/i.test(t)) throw new Error("Only SELECT queries are allowed.");
  if(/\b(INSERT|UPDATE|DELETE|MERGE|CREATE|DROP|ALTER|TRUNCATE|GRANT|REVOKE|EXPORT|LOAD|CALL|DECLARE|EXECUTE|BEGIN|SET)\b(?!\s*\()/i.test(t.replace(/`[^`]*`/g,"")))
    throw new Error("Only read-only SELECT queries are allowed.");
  const tables = [];
  const outside = t.replace(/`([^`]*)`/g,(m,id)=>{ if(id.includes(".")) tables.push(id); return " _q_ "; });
  for(const id of tables){ if(!ASK_TABLES.some(r=>r.test(id))) throw new Error("Table not allowed: "+id+". Allowed: manafa_financing.mi_analytics_events / mi_analytics_event_deliveries, GA4.p_ga4_*_413046941, google_ads.p_ads_{Campaign,CampaignStats,CampaignConversionStats}_3343082801, and GA4/google_ads INFORMATION_SCHEMA.COLUMNS."); }
  const dsRe = new RegExp("\\b("+ASK_DATASETS.join("|")+"|INFORMATION_SCHEMA|databases-472111|region-[\\w-]+)\\s*\\.","i");
  if(dsRe.test(outside)) throw new Error("Write every table as a full backticked path, e.g. `databases-472111.GA4.p_ga4_Events_413046941`.");
  if(/\b(FROM|JOIN)\s+[A-Za-z_][\w-]*\s*\.\s*[A-Za-z_]/i.test(outside)) throw new Error("Write every table as a full backticked path.");
  if(!tables.length) throw new Error("The query reads no allowed table.");
  // personal / device keys and whole JSON blobs
  const noDev = outside.replace(/\bvendor_keys\s*\.\s*singular_device\s*\.\s*(make|model|os_version)\b/gi," _ok_ ");
  if(/\bvendor_keys\b/i.test(noDev)) throw new Error("vendor_keys may only be read as vendor_keys.singular_device.make / model / os_version.");
  if(ASK_FORBIDDEN_KEYS.test(noDev)) throw new Error("That field is a personal or device identifier and can't be queried here.");
  if(/\b(payload|context|attribution)\b(?!\s*\.)(?!\s*,\s*'')/i.test(noDev.replace(/\bAS\s+(payload|context|attribution)\b/gi,""))) throw new Error("Read single JSON fields (JSON_VALUE(payload.amount)), never whole payload / context / attribution.");

function askCheckResult(p, backend){

  upstream_error:"The answer was interrupted by a connection problem. Try again.",
};

function AskSteps({steps,live}){
  if(!steps||!steps.length) return null;
  const okN=steps.filter(s=>s.status==="ok").length;
  return html`<details className="ask-steps" open=${live}>
    <summary><${Icon} name="Database" size=${13}/> ${live?"Working…":"Sources & queries"} <span className="muted">· ${steps.length} call${steps.length>1?"s":""}${okN!==steps.length?" · "+(steps.length-okN)+" failed or retried":""}</span></summary>
    ${steps.map((s,i)=>html`<div key=${i} className=${"ask-step "+s.status}>
      <div className="ask-step-h"><span className=${"ask-dot "+s.status}></span><span className="label-data">${s.tool}</span><span className="t">${s.label}</span>
        <span className="muted small">${s.status==="running"?"running…":s.status==="ok"?(s.rowsN!=null?fmtN(s.rowsN)+" row"+(s.rowsN===1?"":"s"):"")+(s.ms?" · "+fmtDur(s.ms):"")+(s.bytes?" · "+(s.bytes/1048576).toFixed(1)+" MB scanned":""):"error"}</span>
        ${s.code?html`<button className="btn ghost sm" title="Copy" onClick=${()=>{ try{navigator.clipboard.writeText(s.code);}catch(e){} }}><${Icon} name="Copy" size=${12}/></button>`:null}</div>
      ${s.code?html`<pre className="ask-code">${s.code}</pre>`:null}
      ${s.error?html`<div className="note err" style=${{margin:"6px 0"}}>${s.error}</div>`:null}
      ${s.preview&&s.preview.rows&&s.preview.rows.length?html`<details className="ask-prev"><summary className="small muted">Result preview (${Math.min(s.preview.rows.length,25)} of ${fmtN(s.rowsN)})</summary><div className="tablewrap"><table><thead><tr>${s.preview.cols.map(c=>html`<th key=${c}>${c}</th>`)}</tr></thead>
        <tbody>${s.preview.rows.map((r,j)=>html`<tr key=${j}>${s.preview.cols.map(c=>html`<td key=${c}>${r[c]==null?"—":typeof r[c]==="object"?JSON.stringify(r[c]):String(r[c])}</td>`)}</tr>`)}</tbody></table></div></details>`:null}
    </div>`)}
  </details>`;
}

function AskView({ctx}){
  const [msgs,setMsgs]=useState(askLoad);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const [sample,setSample]=useState(undefined);
  const ctlRef=useRef(null); const endRef=useRef(null); const boxRef=useRef(null);
  useEffect(()=>{ let alive=true; (async()=>{ const s=(window.claude&&claude.use)?await claude.use("sample").catch(()=>null):null; if(alive) setSample(()=>s||null); })(); return ()=>{alive=false;}; },[]);
  useEffect(()=>{ askSave(msgs); },[msgs]);
  useEffect(()=>{ endRef.current&&endRef.current.scrollIntoView({block:"end"}); },[msgs.length, busy]);
  useEffect(()=>()=>{ ctlRef.current&&ctlRef.current.abort(); },[]);
  const patchLast=f=>setMsgs(m=>{ const c=m.slice(); c[c.length-1]=f(c[c.length-1]); return c; });

  const ask=async(q)=>{
    q=String(q||"").trim(); if(!q||busy||!sample) return;
    setInput(""); setBusy(true);
    const history=msgs.filter(m=>m.text&&!m.error).slice(-8);
    const turns=[{role:"user",content:askRules(ctx)}];
    history.forEach(m=>turns.push(m.role==="user"?{role:"user",content:m.text}:{role:"assistant",content:m.text+((m.steps||[]).length?"\n\n[queries used: "+m.steps.filter(s=>s.status==="ok").map(s=>s.tool+" — "+s.label).join("; ")+"]":"")}));
    turns.push({role:"user",content:q});
    const t0=Date.now();
    setMsgs(m=>[...m,{role:"user",text:q,ts:t0},{role:"assistant",text:"",steps:[],ts:t0,pending:true}]);
    let sid=0;
    const log=o=>{ const id=++sid; setMsgs(m=>{ const c=m.slice(); const a={...c[c.length-1]}; a.steps=[...(a.steps||[]),{...o,id}]; c[c.length-1]=a; return c; });
      return upd=>setMsgs(m=>{ const c=m.slice(); const a={...c[c.length-1]}; a.steps=(a.steps||[]).map(s=>s.id===id?{...s,...upd}:s); c[c.length-1]=a; return c; }); };
    const ctl=new AbortController(); ctlRef.current=ctl;
    try{
      const r=await sample(turns,{signal:ctl.signal,cache:false,modelTier:"complex",tools:askTools(ctx,log),onText:({text})=>patchLast(a=>({...a,text}))});
      patchLast(a=>({...a,text:r.text,pending:false,ms:Date.now()-t0,truncated:r.truncated,tier:r.modelTierApplied}));
    }catch(e){
      const code=e&&e.code||"upstream_error";
      if(code==="cancelled") patchLast(a=>({...a,text:(e.text||a.text||""),pending:false,stopped:true,ms:Date.now()-t0}));
      else { if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) setSample(null);
        patchLast(a=>({...a,text:code==="refused"?"":(e.text||a.text||""),pending:false,error:ASK_ERR[code]||ASK_ERR.upstream_error,ms:Date.now()-t0})); }
    }
    ctlRef.current=null; setBusy(false); setTimeout(()=>boxRef.current&&boxRef.current.focus(),0);
  };
  const stop=()=>{ ctlRef.current&&ctlRef.current.abort(); };
  const clear=()=>{ if(busy) return; setMsgs([]); };

  return html`<div className="ask">
    <div className="page-h"><div className="grow"><h1>Ask the data</h1>
      <p>Ask in plain words. Claude answers with live numbers from BigQuery (backend, GA4, Google Ads), the Singular sheet and Jira, through your own read-only connectors, and shows every query it ran. Aggregates only; no personal data. Decision-support, not a decision.</p></div>
      ${msgs.length?html`<button className="btn" onClick=${clear} disabled=${busy}><${Icon} name="Trash2" size=${14}/>Clear chat</button>`:null}</div>
    ${sample===null?html`<div className="note warn" style=${{marginBottom:14}}>Chat needs Claude enabled for this page in your view. Open the Command Center in claude.ai and allow Claude when asked.</div>`:null}
    <div className="ask-thread" role="log" aria-live="polite">
      ${!msgs.length?html`<div className="ask-empty"><div className="ask-ic"><${Icon} name="Sparkles" size=${22}/></div>
        <div style=${{fontWeight:600,marginBottom:4}}>What would you like to know?</div>
        <div className="small muted" style=${{marginBottom:14}}>Each answer runs real queries; a typical question takes 30–90 seconds.</div>
        <div className="ask-sugg">${ASK_SUGGEST.map(s=>html`<button key=${s} className="ask-chip" disabled=${!sample||busy} onClick=${()=>ask(s)}>${s}</button>`)}</div></div>`:null}
      ${msgs.map((m,i)=>m.role==="user"
        ? html`<div key=${i} className="ask-u"><div className="b">${m.text}</div></div>`
        : html`<div key=${i} className="ask-a">
            <div className="ask-av"><${Icon} name="Sparkles" size=${14}/></div>
            <div className="ask-body">
              <${AskSteps} steps=${m.steps} live=${!!m.pending}/>
              ${m.text?html`<div className="md ask-md" dangerouslySetInnerHTML=${{__html:mdToHtml(m.text)}}></div>`
                :m.pending?html`<div className="muted ask-think"><span className="ask-dot running"></span>${(m.steps||[]).some(s=>s.status==="running")?"Fetching data…":"Thinking…"}</div>`:null}
              ${m.error?html`<div className="note err" style=${{marginTop:8}}>${m.error}</div>`:null}
              ${m.stopped?html`<div className="small muted" style=${{marginTop:6}}>Stopped.</div>`:null}
              ${m.truncated?html`<div className="small muted" style=${{marginTop:6}}>The answer was cut short; ask for less at once.</div>`:null}
              ${!m.pending&&m.ms?html`<div className="small muted" style=${{marginTop:8}}>${fmtTs(m.ts)} · ${fmtDur(m.ms)}${(m.steps||[]).length?" · "+m.steps.filter(s=>s.status==="ok").length+" data call"+(m.steps.filter(s=>s.status==="ok").length===1?"":"s"):""}</div>`:null}
            </div></div>`)}
      <div ref=${endRef}></div>
    </div>
    <form className="ask-comp" onSubmit=${e=>{e.preventDefault(); ask(input);}}>
      <textarea ref=${boxRef} rows="2" value=${input} disabled=${!sample} placeholder=${sample===undefined?"Connecting…":sample?"Ask about users, funnel, channels, campaigns or tracking…":"Chat unavailable in this view"}
        aria-label="Your question" onInput=${e=>setInput(e.target.value)}
        onKeyDown=${e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); ask(input);} }}></textarea>
      ${busy?html`<button type="button" className="btn" onClick=${stop}><${Icon} name="Square" size=${13}/>Stop</button>`
        :html`<button type="submit" className="btn primary" disabled=${!sample||!input.trim()}><${Icon} name="Send" size=${14}/>Ask</button>`}
    </form>
    <div className="small muted" style=${{marginTop:6}}>Enter to send · Shift+Enter for a new line · Answers use your own Claude usage and connectors.</div>
  </div>`;
}

function BQBanner(){
  const [,t]=useState(0); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState("");
  useEffect(()=>{ const f=()=>t(x=>x+1); bqGlobal.add(f); return ()=>bqGlobal.delete(f); },[]);
  const all=[...bqStore.values()]; const approval=all.filter(e=>e.state.status==="approval"||(e.state.status==="denied"&&e.state.error&&e.state.error.code==="approval_required"));
  const lost=all.find(e=>e.state.status==="denied"&&e.state.error&&e.state.error.code!=="approval_required");
  const stale=all.filter(e=>e.state.status==="stale");
  const refresh=async()=>{ setBusy(true); setMsg(""); let ok=0, fail=null;
    for(const e of all){ try{ await runCall(e); ok++; }
      catch(err){ fail=err&&err.code||"error"; if(fail==="approval_required"||fail==="needs_reauth") break; } }
    bqNotify(); setBusy(false); if(fail) setMsg(fail==="approval_required"?"Approval was declined or couldn't be asked here. Open the page in claude.ai and try again.":"Some queries didn't refresh ("+fail+"). The last data stays on screen."); };
  if(!approval.length && !lost && !stale.length) return null;
  if(lost){ const c=lost.state.error.code; const n=lost.call.server; const m=c==="needs_reauth"?"Your "+n+" connection expired. Reconnect it in claude.ai Settings → Connectors.":c==="server_not_connected"?"Add the "+n+" connector in claude.ai Settings → Connectors to see live data.":c==="selection_required"?"Choose which "+n+" connector this page should use in the claude.ai prompt.":c==="blocked_by_policy"?"Your organization's policy blocks this "+n+" tool for you.":n+" access is turned off for this page in your view.";
    return html`<div className="note warn" style=${{marginBottom:14}}>${m}</div>`; }
  if(approval.length) return html`<div className="note warn" style=${{marginBottom:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
    <span style=${{flex:1,minWidth:240}}>${[...new Set(approval.map(e=>e.call.server))].join(" and ")} need${approval.length&&new Set(approval.map(e=>e.call.server)).size>1?"":"s"} your approval to refresh live data to refresh live data. The last data stays on screen until then.${msg?html`<br/>${msg}`:null}</span>
    <button className="btn sm" disabled=${busy} onClick=${refresh}><${Icon} name="RefreshCw" size=${13}/>${busy?"Refreshing…":"Allow and refresh"}</button></div>`;
  return html`<div className="note" style=${{marginBottom:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}><span style=${{flex:1,minWidth:240}}>A live refresh didn't complete; showing the last data loaded.${msg?html`<br/>${msg}`:null}</span><button className="btn sm" disabled=${busy} onClick=${refresh}><${Icon} name="RefreshCw" size=${13}/>${busy?"Refreshing…":"Refresh now"}</button></div>`;
}

function ReloadButton(){
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState("");
  const go=async()=>{ if(busy) return; setBusy(true); setMsg("");
    try{ const r=await reloadAll(); const t=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Riyadh"});
      setMsg(!r.total?"Nothing to reload yet":r.fail?`${r.ok} of ${r.total} sources reloaded · ${r.fail} didn't answer`:`Reloaded ${r.total} source${r.total>1?"s":""} at ${t}`); }
    catch(e){ setMsg("Reload failed"); }
    setBusy(false); setTimeout(()=>setMsg(""),6000); };
  return html`<div style=${{position:"relative",display:"inline-flex",alignItems:"center",gap:8}}>
    ${msg?html`<span className="small muted hide-sm" role="status" style=${{whiteSpace:"nowrap"}}>${msg}</span>`:null}
    <button className="btn sm" onClick=${go} disabled=${busy} aria-label="Reload live data" title="Reload live data from BigQuery, Google Sheets and Jira">
      <${Icon} name="RefreshCw" size=${14} style=${busy?{animation:"rspin 1s linear infinite"}:null}/><span className="hide-sm">${busy?"Reloading…":"Reload"}</span></button></div>`;
}

const RANGES=[["today","Latest day"],["yesterday","Day before"],["7d","Last 7 days"],["30d","Last 30 days"],["custom","Custom"]];
function useRange(dailyRows){
  const [r,setR]=useState("7d"); const [cf,setCf]=useState(""); const [ct,setCt]=useState("");
  const days = (dailyRows||[]).map(x=>x.d).filter(Boolean);
  const maxDay = days.length ? days[days.length-1] : null;
  const end = maxDay ? addDays(maxDay,-1) : null; // newest replica day is partial
  let from,to;
  if(end){
    if(r==="today"){from=to=end;} else if(r==="yesterday"){from=to=addDays(end,-1);}
    else if(r==="7d"){to=end;from=addDays(end,-6);} else if(r==="30d"){to=end;from=addDays(end,-29);}
    else {to=ct||end; from=cf||addDays(end,-6);}
  }
  const len = from&&to ? Math.round((Date.parse(to)-Date.parse(from))/864e5)+1 : 0;
  const pFrom = from?addDays(from,-len):null, pTo = from?addDays(from,-1):null;
  return {r,setR,cf,setCf,ct,setCt,from,to,pFrom,pTo,end,len};
}

function cohortAgg(rows, platformFilter){

function OrchMap({agents,run,onPick}){
  const W=760,H=290, cx=W/2, cy=48;

  return html`<div className="orch"><svg viewBox=${"0 0 "+W+" "+H} role="img" aria-label="Orchestrator connected to seven agents">
    ${pos.map(p=>{ const s=stOf(p.a.id); return html`<path key=${"e"+p.a.id} className=${"edge "+cls(s)} d=${`M${cx},${cy+22} C${cx},${cy+110} ${p.x},${p.y-110} ${p.x},${p.y-22}`}/>`; })}
    <g className=${"node "+(orchActive?"active":run&&run.status==="completed"?"ok":"")} transform=${`translate(${cx-120},${cy-22})`}>

    ${pos.map((p,i)=>{ const s=stOf(p.a.id); const c=cls(s); const w=Math.min(100,(W-60)/cols-8);
      return html`<g key=${p.a.id} className=${"node "+c} transform=${`translate(${p.x-w/2},${p.y-22})`} onClick=${()=>onPick(p.a.id)} tabIndex="0" role="button" aria-label=${p.a.label+": "+(STATUS[s]||STATUS.idle)[0]} onKeyDown=${e=>e.key==="Enter"&&onPick(p.a.id)}>
        <rect width=${w} height="44" rx="10"/>

        <circle cx=${w-10} cy="10" r="3.5" fill=${c==="active"?"#3A9AF4":c==="ok"?"#22c38e":c==="err"?"#ef5a5a":"#5b6485"}/>

function Timeline({run,agents}){
  if(!run) return html`<div className="empty">No run selected.</div>`;
  const ev=run.events||[]; const name=id=>(agents.find(a=>a.id===id)||{}).label||id||"Orchestrator";
  if(!ev.length) return html`<div className="empty">${run.imported?"This run was imported from its run-log line. It has no step events, so there's no timeline to show.":"No events reported yet."}</div>`;
  const steps=[]; ev.forEach((e,i)=>{ if(e.kind==="step_done"||e.kind==="run_done"||e.kind==="error"||e.kind==="warning"||e.kind==="run_start"||e.kind==="agent_start"||e.kind==="agent_done"){ const start=[...ev.slice(0,i)].reverse().find(x=>x.kind==="step_start"&&x.agent===e.agent&&x.step===e.step); steps.push({...e, dur:start?Date.parse(e.ts)-Date.parse(start.ts):null}); }
    else if(e.kind==="step_start" && !ev.slice(i+1).some(x=>x.agent===e.agent&&x.step===e.step&&x.kind==="step_done")) steps.push({...e,running:true}); });
  return html`<div className="tl" style=${{maxHeight:420,overflow:"auto"}}>${steps.map((e,i)=>html`<div key=${i} className=${"tl-item "+(e.kind==="error"?"err":e.kind==="warning"?"warn":e.running?"run":"ok")} style=${{animationDelay:(i*30)+"ms"}}>
    <span className="pin"></span>
    <div style=${{display:"flex",gap:8,alignItems:"baseline",flexWrap:"wrap"}}><b className="small">${name(e.agent)}</b><span className="small">${e.step||e.message}</span>${e.running?html`<${Status} s="running"/>`:null}</div>
    <div className="small muted">${fmtTs(e.ts)}${e.dur!=null?` · ${fmtDur(e.dur)}`:""}${e.step&&e.message&&e.message!==e.step?` · ${e.message}`:""}</div>
    ${e.output?html`<div className="small" style=${{marginTop:3}}><span className="muted">Output: </span>${e.output}</div>`:null}
  </div>`)}</div>`;
}
function Feed({runs,agents}){

  return html`<div>
    <div style=${{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}><span className="small muted" style=${{flex:1}}>${ev.length} events from recorded runs</span>

function jAreaOf(s){ s=s||""; if(/\[BE\]/i.test(s)) return "backend"; if(/\[(API|UI)\]\s*\[App\]|\[App\]/i.test(s)) return "mobile"; if(/\[(API|UI)\]\s*\[Web\]|\[Web\]/i.test(s)) return "web"; return "other"; }
const J_AREA = {backend:["Backend","#7f8cff"],mobile:["Mobile","#22c38e"],web:["Web","#3A9AF4"],other:["Other","#8b93b0"]};
function jStrip(s){ return String(s||"").replace(/^(\s*\[[^\]]+\]\s*)+/,""); }
function jTqa(labels){ return (labels||[]).filter(l=>/^tqa-\d+$/i.test(l)); }
function jInitials(n){ return String(n||"?").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[^A-Za-z؀-ۿ ]/g," ").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?"; }
function jColor(n){ let h=0; for(const c of String(n||"")) h=(h*31+c.charCodeAt(0))>>>0; return ["#f2b136","#7f8cff","#22c38e","#5ec8d8","#c084fc","#ef8a5a","#3A9AF4"][h%7]; }
function jDate(s){ if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return "—"; return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"Asia/Riyadh"}); }
function JAvatar({name}){ return name?html`<span className="jr-av" title=${name} style=${{background:jColor(name)}}>${jInitials(name)}</span>`:html`<span className="jr-av" title="No Dev Assignee" style=${{background:"#2a3358",color:"#8b93b0"}}>–</span>`; }
function JStatusIcon({cat,size=16}){
  const s=size, r=s/2-1.5, c=s/2;
  if(cat==="done") return html`<svg width=${s} height=${s} viewBox=${"0 0 "+s+" "+s} aria-hidden="true"><circle cx=${c} cy=${c} r=${r} fill="#7f6cf0"/><path d=${`M${s*.3} ${s*.52} L${s*.45} ${s*.66} L${s*.72} ${s*.36}`} stroke="#0d1330" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>`;
  if(cat==="progress") return html`<svg width=${s} height=${s} viewBox=${"0 0 "+s+" "+s} aria-hidden="true"><circle cx=${c} cy=${c} r=${r} fill="none" stroke="#f2b136" strokeWidth="1.6"/><path d=${`M${c} ${c-r+2.5} A${r-2.5} ${r-2.5} 0 0 1 ${c} ${c+r-2.5} Z`} fill="#f2b136"/></svg>`;
  if(cat==="staged") return html`<svg width=${s} height=${s} viewBox=${"0 0 "+s+" "+s} aria-hidden="true"><circle cx=${c} cy=${c} r=${r} fill="none" stroke="#3A9AF4" strokeWidth="1.6" strokeDasharray="2 2.2"/></svg>`;
  if(cat==="outside") return html`<svg width=${s} height=${s} viewBox=${"0 0 "+s+" "+s} aria-hidden="true"><circle cx=${c} cy=${c} r=${r} fill="none" stroke="#5b6485" strokeWidth="1.6"/><circle cx=${c} cy=${c} r="2" fill="#5b6485"/></svg>`;
  return html`<svg width=${s} height=${s} viewBox=${"0 0 "+s+" "+s} aria-hidden="true"><circle cx=${c} cy=${c} r=${r} fill="none" stroke="#8b93b0" strokeWidth="1.6" strokeDasharray="2.6 2"/></svg>`;
}
function JPrio({p}){ const n=p==="Highest"||p==="High"?3:p==="Medium"?2:p?1:0; return html`<span title=${p?("Priority: "+p):"No priority"} style=${{display:"inline-flex",alignItems:"flex-end",gap:2,height:12,width:16}}>${[1,2,3].map(i=>html`<span key=${i} style=${{width:3,height:4*i,borderRadius:1,background:i<=n?(n===3?"#ef8a5a":"#c9cfe6"):"#2a3358"}}></span>`)}</span>`; }
function mdToHtml(md){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)\*([^*\s][^*]*)\*(?=\s|[.,;:)]|$)/g,"$1<i>$2</i>");
  const lines=String(md||"").split("\n"); let out=[], i=0;
  while(i<lines.length){ const l=lines[i];
    if(/^##\s+/.test(l)){ out.push("<h2>"+inline(l.replace(/^##\s+/,""))+"</h2>"); i++; continue; }
    if(/^\|/.test(l)){ const rows=[]; while(i<lines.length&&/^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\|\s*-/.test(r)); out.push("<div class='tablewrap'><table><thead><tr>"+cells(body[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+body.slice(1).map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"); continue; }
    if(/^\s*-\s+/.test(l)){ const it=[]; while(i<lines.length&&/^\s*-\s+/.test(lines[i])){ it.push("<li>"+inline(lines[i].replace(/^\s*-\s+/,""))+"</li>"); i++; } out.push("<ul>"+it.join("")+"</ul>"); continue; }
    if(/^\d+\.\s+/.test(l)){ const it=[]; while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){ it.push("<li>"+inline(lines[i].replace(/^\d+\.\s+/,""))+"</li>"); i++; } out.push("<ol>"+it.join("")+"</ol>"); continue; }
    if(/^_.*_$/.test(l.trim())){ out.push("<p class='small muted'><i>"+inline(l.trim().slice(1,-1))+"</i></p>"); i++; continue; }
    if(l.trim()===""){ i++; continue; }
    out.push("<p>"+inline(l)+"</p>"); i++;
  }
  return out.join("");
}
function JRow({k,cat,title,area,tqa,prio,date,dev,onOpen,extra}){

function JGroup({cat,label,count,children}){ return html`<div><div className="jr-group"><${JStatusIcon} cat=${cat}/><span>${label}</span><span className="cnt">${count}</span></div>${children}</div>`; }

    ${open?html`<div className="scrim" onClick=${()=>setOpen(null)}></div><aside className="drawer" role="dialog" aria-modal="true" aria-label="Ticket details">
      <div className="dh"><div style=${{flex:1,minWidth:0}}>
        <div className="small muted mono">${open.type==="draft"?"DRAFT · "+(open.d.tqa||[]).join(", "):open.type==="ticket"?open.t.key:open.i.id}</div>
        <h2 style=${{marginTop:4}}>${open.type==="draft"?open.d.summary:open.type==="ticket"?open.t.summary:(open.i.title||open.i.id)}</h2></div>
        <button className="icon-btn" onClick=${()=>setOpen(null)} aria-label="Close"><${Icon} name="X"/></button></div>
      <div className="db">
        ${open.type==="draft"?html`<div style=${{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
            <span className="jr-chip"><${JStatusIcon} cat="staged" size=${12}/>Awaiting approval</span>
            <span className="jr-chip"><span className="d" style=${{background:(J_AREA[open.d.area]||J_AREA.other)[1]}}></span>${(J_AREA[open.d.area]||J_AREA.other)[0]}</span>
            <span className="jr-chip">${open.d.issuetype} · ${open.d.priority}</span>
            <span className="jr-chip"><${JAvatar} name=${open.d.dev}/>${open.d.dev}</span>
            <span className="jr-chip">Parent ${open.d.parent||JIRA_EPIC}</span></div>
          <div className="note" style=${{marginBottom:12}}>Not in Jira yet. Claude creates it under ${JIRA_EPIC} only after Amir approves the drafts in chat.</div>
          <div className="jr-md" dangerouslySetInnerHTML=${{__html:mdToHtml(open.d.description)}}></div>`
        :open.type==="ticket"?html`<div className="jr-prop" style=${{marginBottom:14}}>
            <span className="k">Status</span><span style=${{display:"flex",gap:8,alignItems:"center"}}><${JStatusIcon} cat=${open.t.cat}/>${open.t.status}</span>
            <span className="k">Dev Assignee</span><span style=${{display:"flex",gap:8,alignItems:"center"}}><${JAvatar} name=${open.t.dev}/>${open.t.dev||"—"}</span>
            <span className="k">Area</span><span>${(J_AREA[open.t.area]||J_AREA.other)[0]}</span>
            <span className="k">Priority</span><span>${open.t.priority||"—"}</span>
            <span className="k">Tracking</span><span className="mono">${open.t.tqa.join(", ")||"—"}</span>
            <span className="k">Created</span><span>${jDate(open.t.created)}</span>
            <span className="k">Resolved</span><span>${jDate(open.t.resolved)}</span></div>
          <a className="btn primary" href=${"https://"+JIRA_SITE+"/browse/"+open.t.key} target="_blank" rel="noopener"><${Icon} name="ExternalLink" size=${14}/>Open ${open.t.key} in Jira</a>`
        :html`<div className="jr-prop" style=${{marginBottom:14}}>
            <span className="k">Owner</span><span>${OUTSIDE_SQUAD[open.i.id]}</span>
            <span className="k">Severity</span><span>${open.i.severity||"—"}</span>
            <span className="k">Found</span><span>${open.i.found||"—"}</span></div>
          <p className="small" style=${{color:"#c9cfe6"}}>${open.i.what||""}</p>
          ${open.i.next_check?html`<p className="small muted">Next check: ${open.i.next_check}</p>`:null}
          <div className="note">Not a squad development task, so no ISQ ticket. It stays on the tracking board until its owner fixes it.</div>`}
      </div></aside>`:null}
  </div>`;
}

/* ======================================================================
   Event quality
   ====================================================================== */
function QualityView({ctx}){
  const del=useBQ("delivery",SQL.delivery);
  const issues=ctx.issuesQ.docs; const [show,setShow]=useState("open"); const [open,setOpen]=useState(null);
  const list=issues.filter(i=>show==="all"||(show==="open"?i.status!=="resolved":i.status==="resolved"));
  const sev=["high","med","low"];
  const weeks=[...new Set((del.rows||[]).map(r=>r.wk))].sort();
  return html`<div>
    <div className="page-h"><div className="grow"><h1>Event quality & monitoring</h1><p>Issues come from the tracking-health agent. Delivery health is queried live from the backend's own delivery log.</p></div>
      <div className="seg">${[["open","Open"],["resolved","Resolved"],["all","All"]].map(([k,l])=>html`<button key=${k} className=${show===k?"on":""} onClick=${()=>setShow(k)}>${l}</button>`)}</div></div>
    <div className="grid g3" style=${{marginBottom:14}}>
      ${sev.map(s=>{ const L=list.filter(i=>(i.severity||"low")===s); return html`<div className="panel" key=${s}><div className="panel-h"><h2>${s==="high"?"High":s==="med"?"Medium":"Low"}</h2><span className="badge">${L.length}</span></div>
        <div className="grid" style=${{gap:8}}>${L.map(i=>html`<div key=${i.id} className=${"issue sev-"+s} onClick=${()=>setOpen(open===i.id?null:i.id)} tabIndex="0">
          <div style=${{display:"flex",gap:8,alignItems:"center"}}><b className="mono">${i.id}</b>${i.escalated?html`<span className="st st-failed">Escalated</span>`:null}<span className="grow" style=${{flex:1}}></span><span className="small muted">${i.owner||""}</span></div>
          <div className="small" style=${{marginTop:4}}>${i.title||String(i.what||"").slice(0,140)}</div>
          ${open===i.id?html`<div className="small muted" style=${{marginTop:8,whiteSpace:"pre-wrap"}}>${i.what}${i.latest?"\n\nLatest: "+i.latest:""}${i.next_check?"\n\nNext check: "+i.next_check:""}</div>`:null}
        </div>`)}${!L.length&&html`<div className="muted small">None.</div>`}</div></div>`; })}
    </div>
    <div className="grid g2">
      <div className="panel span2"><div className="panel-h"><h2>GA4 delivery health: events sent without a client ID</h2><span className="grow"></span><${Fresh} q=${del}/><span className="label-data">Data</span></div>
        ${del.rows?html`<${ChartC} config=${{type:"line",data:{labels:weeks,datasets:["web","ios","android"].map((p,i)=>({label:p,data:weeks.map(w=>{const r=(del.rows||[]).find(x=>x.wk===w&&x.platform===p); return r?+(r.degraded/r.n*100).toFixed(1):null;}),borderColor:ACCENTS[i],backgroundColor:ACCENTS[i],tension:.25,pointRadius:3}))},options:{scales:{x:gridX,y:{...gridY,ticks:{callback:v=>v+"%"}}}}}}/>
          <div className="small muted" style=${{marginTop:8}}>Share of backend events delivered to GA4 as "degraded" each week. Web stepped up in the week of 26 Oct (tqa-013). The latest week may be partial.</div>`:html`<${BQState} q=${del}/>`}
        <${Source}>backend · mi_analytics_event_deliveries<//></div>
    </div></div>`;
}

/* ======================================================================
   Reports
   ====================================================================== */
function ReportsView({ctx}){
  const reps=ctx.reportsQ.docs; const [sel,setSel]=useState(()=>window.__openReport||null);
  useEffect(()=>{ window.__openReport=null; },[]);
  const r=reps.find(x=>x.id===sel)||reps[0];
  const daily=useBQ("daily",SQL.daily); const rows=daily.rows||[]; const end=rows.length?addDays(rows[rows.length-1].d,-1):null;
  const wk=k=>end?sumRange(rows,k,addDays(end,-6),end):null, pwk=k=>end?sumRange(rows,k,addDays(end,-13),addDays(end,-7)):null;
  return html`<div>
    <div className="page-h"><div className="grow"><h1>Reports & business insights</h1><p><span className="label-data">Data</span> marks numbers queried from a source. <span className="label-ai">AI-generated</span> marks an agent's interpretation or recommendation, which a named person reviews before acting on it.</p></div></div>
    <div className="panel" style=${{marginBottom:14}}><div className="panel-h"><h2>Key business metrics, last 7 complete days</h2><span className="grow"></span><span className="label-data">Data</span></div>
      ${daily.rows?html`<div className="grid g4">${[["Registrations","reg"],["KYC completed","kyc"],["Deposits","dep"],["First investments","first_inv"],["Investments","inv"],["Auto-invest enabled","ai_on"],["Deposit volume (SAR)","dep_sar",fmtSAR],["Investment volume (SAR)","inv_sar",fmtSAR]].map(([l,k,f])=>html`<div key=${k}><div className="small muted">${l}</div><div style=${{display:"flex",gap:8,alignItems:"baseline"}}><b style=${{fontSize:20}}>${(f||fmtN)(wk(k))}</b><${Delta} cur=${wk(k)} prev=${pwk(k)}/></div></div>`)}</div>
      <div className="small muted" style=${{marginTop:8}}>${end?`${addDays(end,-6)} to ${end}, against the 7 days before.`:""}</div>`:html`<${BQState} q=${daily}/>`}</div>
    <div className="grid" style=${{gridTemplateColumns:"minmax(220px,300px) 1fr",gap:14}}>
      <div className="panel"><div className="panel-h"><h2>Reports</h2></div><div className="grid" style=${{gap:6}}>
        ${reps.map(x=>html`<button key=${x.id} className="btn" style=${{justifyContent:"flex-start",textAlign:"left",whiteSpace:"normal",borderColor:r&&r.id===x.id?"var(--brand-2)":null}} onClick=${()=>setSel(x.id)}>
          <span><b style=${{display:"block"}}>${x.title}</b><span className="small muted">${x.week||""} · ${x.loop||""}</span></span></button>`)}
        ${!reps.length&&html`<div className="muted small">${ctx.reportsQ.loading?"Loading…":"No reports yet."}</div>`}</div></div>
      <div className="panel">${r?html`<div>
        <div style=${{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:10}}><h2 style=${{flex:1}}>${r.title}</h2>${r.verdict?html`<span className=${"st "+(/ESCAL/i.test(r.verdict)?"st-failed":/ISSUE/i.test(r.verdict)?"st-waiting":"st-completed")}>${r.verdict}</span>`:null}</div>
        ${r.findings&&r.findings.length?html`<div style=${{marginBottom:14}}><div style=${{display:"flex",gap:8,alignItems:"center",marginBottom:6}}><h3>Key findings</h3><span className="label-data">Data (observed)</span></div><ul className="small">${r.findings.map((f,i)=>html`<li key=${i}>${f}</li>`)}</ul></div>`:null}
        ${r.insights&&r.insights.length?html`<div style=${{marginBottom:14}}><div style=${{display:"flex",gap:8,alignItems:"center",marginBottom:6}}><h3>Insights</h3><span className="label-ai">AI-generated</span></div><ul className="small">${r.insights.map((f,i)=>html`<li key=${i}>${f}</li>`)}</ul></div>`:null}
        ${r.actions&&r.actions.length?html`<div style=${{marginBottom:14}}><div style=${{display:"flex",gap:8,alignItems:"center",marginBottom:6}}><h3>Recommended actions</h3><span className="label-ai">AI-generated · needs human approval</span></div><ul className="small">${r.actions.map((f,i)=>html`<li key=${i}>${f}</li>`)}</ul></div>`:null}
        <details open=${!(r.findings&&r.findings.length)}><summary className="small muted" style=${{cursor:"pointer",marginBottom:8}}>Full report (agent-written; findings marked O = observed, I = inferred)</summary>
          <div className="md" dangerouslySetInnerHTML=${{__html:mdToHtml(r.markdown)}}></div></details>
        <div className="small muted" style=${{marginTop:10}}>Source file: <code className="mono">${r.path||"—"}</code></div></div>`:html`<div className="empty">Pick a report.</div>`}</div>
    </div></div>`;
}

/* ======================================================================
   Agent configuration (read-only)
   ====================================================================== */
function ConfigView({ctx}){
  const agents=ctx.agentsQ.docs;
  return html`<div>
    <div className="page-h"><div className="grow"><h1>Agent configuration</h1><p>Read-only view of each agent's specification. Changes are made in the skill files in the repo (<code className="mono">.claude/skills/&lt;agent&gt;/SKILL.md</code>) and reviewed like code.</p></div></div>
    <div className="grid g2">${agents.map((a,i)=>html`<div className="panel" key=${a.id}>
      <div className="panel-h"><span className="av" style=${{width:30,height:30,borderRadius:8,display:"grid",placeItems:"center",background:ACCENTS[i%7]+"22",color:ACCENTS[i%7]}}><${Icon} name=${a.icon||"Bot"} size=${16}/></span><h2>${a.label}</h2><span className="grow"></span><span className="mono muted">${a.id}</span></div>
      <dl className="kv"><dt>Cadence</dt><dd>${a.cadence}</dd><dt>Acts when</dt><dd>${a.acts_when}</dd><dt>Depends on</dt><dd>${(a.depends_on||[]).join(", ")||"—"}</dd><dt>State</dt><dd className="mono">${a.state_file}</dd><dt>Skill</dt><dd className="mono">${a.skill_path}</dd></dl>
      <h3 style=${{margin:"12px 0 6px"}}>Steps</h3><ol className="small" style=${{margin:0,paddingLeft:18}}>${(a.steps||[]).map((s,j)=>html`<li key=${j}>${s}</li>`)}</ol>
    </div>`)}</div>
    ${!agents.length&&html`<div className="empty">No agent registry loaded.</div>`}</div>`;
}

/* ======================================================================
   System settings
   ====================================================================== */
function SystemView({ctx}){
  const f=ctx.fresh; const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Riyadh"});
  return html`<div>
    <div className="page-h"><div className="grow"><h1>System settings</h1><p>Where the data comes from, how fresh it is, and the rules every agent follows.</p></div></div>
    <div className="grid g2">
      <div className="panel"><div className="panel-h"><h2>Data freshness</h2><span className="grow"></span><${Fresh} q=${f}/></div>
        ${f.rows?html`<table><thead><tr><th>Source</th><th>Latest day</th><th>Age</th></tr></thead><tbody>
          ${(f.rows||[]).map(r=>{ const age=r.latest_date?Math.round((Date.parse(today)-Date.parse(r.latest_date))/864e5):null; return html`<tr key=${r.source}><td>${r.source}</td><td className="mono">${r.latest_date||"—"}</td><td><span className=${"st "+(age==null?"st-idle":age>8?"st-failed":age>3?"st-waiting":"st-completed")}>${age==null?"—":age+" d"}</span></td></tr>`; })}
          <tr><td>Singular</td><td colSpan="2"><span className="st st-idle">Not configured (not in BigQuery)</span></td></tr>
          <tr><td>Meta · TikTok · Snapchat · X</td><td colSpan="2"><span className="st st-idle">Not configured</span></td></tr>
          <tr><td>Warehouse layer (gold)</td><td colSpan="2"><span className="st st-failed">Suspended: shows staging data (tqa-012)</span></td></tr></tbody></table>`:html`<${BQState} q=${f}/>`}</div>
      <div className="panel"><div className="panel-h"><h2>Environment</h2></div><dl className="kv">
        <dt>Mode</dt><dd>Local, on demand. Agents run in the Claude project chat.</dd><dt>BigQuery</dt><dd className="mono">databases-472111</dd>
        <dt>Region</dt><dd>me-central2 (Dammam, Saudi Arabia) only</dd><dt>Access</dt><dd>Read-only queries; aggregated results only</dd>
        <dt>Conversion truth</dt><dd className="mono">manafa_financing.mi_analytics_events</dd><dt>Timezone</dt><dd>Asia/Riyadh, ISO weeks</dd></dl></div>
      <div className="panel"><div className="panel-h"><h2>Compliance (SAMA / PDPL)</h2></div><ul className="small" style=${{margin:0,paddingLeft:18}}>
        <li>No personal data in queries, state, logs, reports or this page.</li><li>Customer tables (silver, curated, staging) are never queried.</li>
        <li>Everything here is decision support; spend, customer-facing and regulatory actions need a named person's approval.</li><li>Agents never change budgets, bids, campaigns, tracking or live ads.</li></ul></div>
      <div className="panel"><div className="panel-h"><h2>Deploy phase (not active yet)</h2></div><ul className="small" style=${{margin:0,paddingLeft:18}}>
        <li>marketing_mart dataset + read-only service account</li><li>GitHub remote and scheduled runs</li><li>#marketing-loops Slack channel</li><li>Raw GA4 export, backfills, Singular and social spend in BigQuery</li></ul></div>
    </div></div>`;
}

const st=document.createElement("style"); st.textContent="@keyframes draw{to{stroke-dashoffset:0}}"; document.head.appendChild(st);
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
